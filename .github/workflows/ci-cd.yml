name: Node CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  run-node:
    runs-on: ubuntu-latest

    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run project
        run: npm start
